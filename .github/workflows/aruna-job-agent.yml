name: Aruna Linux Job Agent

on:
  push:
    branches:
      - main

  workflow_dispatch:

  schedule:
    - cron: "30 8 * * *"
      timezone: "Asia/Kolkata"

permissions:
  contents: write

jobs:
  run-aruna-job-agent:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Aruna branch
        uses: actions/checkout@v4
        with:
          ref: aruna_JobSearch
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Aruna Job Agent
        env:
          EMAIL_HOST: ${{ secrets.ARUNA_EMAIL_HOST }}
          EMAIL_PORT: ${{ secrets.ARUNA_EMAIL_PORT }}
          EMAIL_FROM: ${{ secrets.ARUNA_EMAIL_FROM }}
          EMAIL_PASSWORD: ${{ secrets.ARUNA_EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.ARUNA_EMAIL_TO }}
        run: |
          python run_aruna.py

      - name: Commit updated Aruna history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/aruna_job_history.csv
          git add data/aruna_jobs.csv
          git add data/aruna_daily_digest.html

          if git diff --cached --quiet; then
            echo "No Aruna history changes to commit."
          else
            git commit -m "Update Aruna job agent history"
            git push origin HEAD:aruna_JobSearch
          fi