name: Siva Job Agent

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * *"
      timezone: "Asia/Kolkata"

permissions:
  contents: write

jobs:
  run-job-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Aruna Job Agent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python run_aruna.py

      - name: Commit updated Aruna history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/aruna_job_history.csv data/aruna_jobs.csv data/aruna_daily_digest.html data/aruna_ai_queue.csv

          if git diff --cached --quiet; then
            echo "No Aruna history changes to commit."
          else
            git commit -m "Update Aruna job agent history"
            git push
          fi